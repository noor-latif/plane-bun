{
  "lockfile-version": 1,
  "manifest": {
    "schema-version": "1.19.0",
    "description": "  Plane, self-hosted locally from the Flox Catalog.\n\n  Toolchain: Node 22, Bun 1.4.2, Python 3.12, uv.\n  Services: PostgreSQL 15, Valkey, RabbitMQ, MinIO, the Django API and the\n  four React Router apps.\n\n  Get everything up:\n\n      flox activate\n      flox services start\n\n  Register the instance admin at http://localhost:3001/god-mode/ and then log\n  in at http://localhost:3000. Service data lives in .flox/data.\n",
    "install": {
      "bun": {
        "pkg-path": "bun",
        "pkg-group": "bun",
        "version": "1.4.2"
      },
      "minio": {
        "pkg-path": "minio"
      },
      "nodejs": {
        "pkg-path": "nodejs_22"
      },
      "postgresql": {
        "pkg-path": "postgresql_15"
      },
      "python312": {
        "pkg-path": "python312"
      },
      "rabbitmq-server": {
        "pkg-path": "rabbitmq-server"
      },
      "valkey": {
        "pkg-path": "valkey"
      }
    },
    "hook": {
      "on-activate": "  set -u\n  root=\"${FLOX_ENV_PROJECT:?}\"\n  export PLANE_DATA=\"$root/.flox/data\"\n\n  mkdir -p \"$PLANE_DATA\"/pg \"$PLANE_DATA\"/valkey \"$PLANE_DATA\"/rabbitmq \\\n           \"$PLANE_DATA\"/rabbitmq/mnesia \"$PLANE_DATA\"/rabbitmq/log \\\n           \"$PLANE_DATA\"/rabbitmq/home \"$PLANE_DATA\"/minio \"$PLANE_DATA\"/logs \\\n           \"$PLANE_DATA\"/uv/bin\n\n  # uv is provisioned by bootstrap at the version apps/api/pyproject.toml\n  # requires: the catalog carries no matching build. Putting the directory on\n  # PATH now means later services pick the binary up once bootstrap installs it.\n  export PATH=\"$PLANE_DATA/uv/bin:$PATH\"\n  export RABBITMQ_MNESIA_BASE=\"$PLANE_DATA/rabbitmq/mnesia\"\n  export RABBITMQ_LOG_BASE=\"$PLANE_DATA/rabbitmq/log\"\n  # Loopback-only listener; RABBITMQ_NODE_IP_ADDRESS is unreliable in 4.x.\n  printf 'listeners.tcp.default = 127.0.0.1:5672\\n' > \"$PLANE_DATA/rabbitmq/rabbitmq.conf\"\n  export RABBITMQ_CONFIG_FILE=\"$PLANE_DATA/rabbitmq/rabbitmq.conf\"\n\n  # Front-end env files are plain copies; the examples already point at\n  # localhost:8000 / 3000 / 3001 / 3002 / 3100.\n  for app in web admin space live; do\n    if [ ! -f \"$root/apps/$app/.env\" ] && [ -f \"$root/apps/$app/.env.example\" ]; then\n      cp \"$root/apps/$app/.env.example\" \"$root/apps/$app/.env\"\n    fi\n  done\n\n  # The API env is the one that needs values: catalog services run on host\n  # ports, and PostgreSQL gets 5433 so the environment never collides with a\n  # PostgreSQL already running on the machine.\n  if [ ! -f \"$root/apps/api/.env\" ] && [ -f \"$root/apps/api/.env.example\" ]; then\n    secret=\"$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 50)\"\n    sed -e 's/^POSTGRES_HOST=.*/POSTGRES_HOST=\"127.0.0.1\"/' \\\n        -e 's/^POSTGRES_PORT=.*/POSTGRES_PORT=5433/' \\\n        -e 's/^REDIS_HOST=.*/REDIS_HOST=\"127.0.0.1\"/' \\\n        -e 's/^RABBITMQ_HOST=.*/RABBITMQ_HOST=\"127.0.0.1\"/' \\\n        -e 's|^DATABASE_URL=.*|DATABASE_URL=postgresql://plane:plane@127.0.0.1:5433/plane|' \\\n        -e 's|^REDIS_URL=.*|REDIS_URL=redis://127.0.0.1:6379/|' \\\n        \"$root/apps/api/.env.example\" > \"$root/apps/api/.env\"\n    printf 'SECRET_KEY=\"%s\"\\n' \"$secret\" >> \"$root/apps/api/.env\"\n  fi\n"
    },
    "options": {},
    "services": {
      "api": {
        "command": "  set -a; . \"$FLOX_ENV_PROJECT/apps/api/.env\"; set +a\n  for _ in $(seq 60); do\n    curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null && break\n    sleep 1\n  done\n  cd \"$FLOX_ENV_PROJECT/apps/api\"\n  exec uv run bash bin/docker-entrypoint-api-local.sh\n",
        "depends-on": {
          "bootstrap": {
            "condition": "process_completed_successfully"
          },
          "minio": {
            "condition": "process_started"
          }
        }
      },
      "bootstrap": {
        "command": "  set -euo pipefail\n  root=\"$FLOX_ENV_PROJECT\"\n\n  # The catalog has no uv build matching apps/api/pyproject.toml's\n  # required-version, so fetch that exact release once.\n  want=\"$(sed -n 's/^required-version *= *\"==\\(.*\\)\"/\\1/p' \"$root/apps/api/pyproject.toml\")\"\n  have=\"$(uv --version 2>/dev/null | awk '{print $2}' || true)\"\n  if [ -n \"$want\" ] && [ \"$have\" != \"$want\" ]; then\n    curl -LsSf \"https://astral.sh/uv/$want/install.sh\" \\\n      | env UV_INSTALL_DIR=\"$PLANE_DATA/uv/bin\" INSTALLER_NO_MODIFY_PATH=1 sh\n  fi\n\n  bun install --frozen-lockfile\n\n  for _ in $(seq 60); do\n    pg_isready -h 127.0.0.1 -p 5433 -U plane >/dev/null 2>&1 && break\n    sleep 1\n  done\n  createdb -h 127.0.0.1 -p 5433 -U plane plane 2>/dev/null || true\n\n  # The API connects as plane/plane on vhost plane. rabbitmqctl needs the same\n  # HOME (Erlang cookie) as the service; readiness is polled, not assumed.\n  (\n    export HOME=\"$PLANE_DATA/rabbitmq/home\"\n    for _ in $(seq 60); do\n      rabbitmqctl -q status >/dev/null 2>&1 && break\n      sleep 1\n    done\n    if rabbitmqctl -q list_users | cut -f1 | grep -qx plane; then\n      rabbitmqctl -q change_password plane plane\n    else\n      rabbitmqctl -q add_user plane plane\n    fi\n    rabbitmqctl -q add_vhost plane || true\n    rabbitmqctl -q set_permissions -p plane plane \".*\" \".*\" \".*\"\n  )\n\n  uv sync --project \"$root/apps/api\"\n\n  set -a; . \"$root/apps/api/.env\"; set +a\n  cd \"$root/apps/api\"\n  uv run python manage.py migrate --settings=plane.settings.local\n",
        "shutdown": {
          "timeout-seconds": 10
        },
        "depends-on": {
          "postgres": {
            "condition": "process_started"
          },
          "rabbitmq": {
            "condition": "process_started"
          }
        }
      },
      "minio": {
        "command": "exec minio server \"$PLANE_DATA/minio\" --address 127.0.0.1:9000 --console-address 127.0.0.1:9090",
        "vars": {
          "MINIO_ROOT_PASSWORD": "secret-key",
          "MINIO_ROOT_USER": "access-key"
        }
      },
      "postgres": {
        "command": "  set -euo pipefail\n  PGDATA=\"$PLANE_DATA/pg\"\n  if [ ! -f \"$PGDATA/PG_VERSION\" ]; then\n    initdb -D \"$PGDATA\" -U plane --auth=trust >/dev/null\n  fi\n  exec postgres -D \"$PGDATA\" -p 5433 -k \"$PGDATA\"\n",
        "shutdown": {
          "timeout-seconds": 30
        }
      },
      "rabbitmq": {
        "command": "  export HOME=\"$PLANE_DATA/rabbitmq/home\"\n  exec rabbitmq-server\n",
        "shutdown": {
          "timeout-seconds": 30
        }
      },
      "valkey": {
        "command": "exec valkey-server --bind 127.0.0.1 --port 6379 --dir \"$PLANE_DATA/valkey\" --appendonly no"
      },
      "web": {
        "command": "exec bun run dev",
        "depends-on": {
          "bootstrap": {
            "condition": "process_completed_successfully"
          }
        }
      }
    }
  },
